<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0B0F0E" />
    <meta name="description" content="SATZIO – Trainieren. Abhaken. Stärker werden. Fitness-Tracking so einfach wie eine Notizen-App." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SATZIO" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>SATZIO</title>
    <script>
      // Theme vor dem ersten Rendern setzen (kein Aufblitzen)
      try {
        var t = localStorage.getItem('satzio-theme') || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Plattform-Design vor dem ersten Paint (iOS Liquid Glass / Android Material 3); maßgeblich: src/lib/platform.ts
      try {
        var p = null;
        try { p = localStorage.getItem('satzio-platform-style'); } catch (e) {}
        if (p !== 'ios' && p !== 'android' && p !== 'web') {
          var ua = navigator.userAgent;
          p = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) ? 'ios' : /Android/i.test(ua) ? 'android' : 'web';
        }
        document.documentElement.dataset.platform = p;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
