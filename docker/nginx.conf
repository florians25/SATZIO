# SATZIO – nginx: liefert die PWA aus und leitet /api an das Backend weiter
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { application/manifest+json webmanifest; }
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Keine IP-Adressen/Query-Strings im Zugriffslog (Datenminimierung)
  log_format satzio '$time_iso8601 "$request_method $uri" $status $body_bytes_sent ${request_time}s';
  access_log /dev/stdout satzio;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 25m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

  upstream satzio_api { server api:3000; keepalive 16; }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
      proxy_pass http://satzio_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
    }

    # ── Web-App (PWA) unter /app/ ──
    location = /app { return 301 /app/; }
    # Service Worker & Manifest nie cachen → Updates kommen zuverlässig an
    location = /app/sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Service-Worker-Allowed "/app/" always; try_files $uri =404; }
    location = /app/manifest.webmanifest { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location ~* ^/app/workbox-.*\.js$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    # Gehashte Assets dauerhaft cachen
    location /app/assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    # SPA-Fallback
    location /app/ {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      try_files $uri $uri/ /app/index.html;
    }

    # ── Produktwebsite unter / ──
    location /assets/ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
      try_files $uri $uri.html $uri/ =404;
    }
  }
}
